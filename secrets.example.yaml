# Скопируйте этот файл в secrets.yaml (без .example) и впишите свои значения.
# secrets.yaml НЕ должен попадать в git - он уже добавлен в .gitignore.

wifi_ssid: "your_wifi_name"
wifi_password: "your_wifi_password"

# Пароль для OTA-обновлений прошивки. Сгенерируйте свой, например:
#   python3 -c "import secrets; print(secrets.token_hex(16))"
ota_password: "generate_your_own_random_password_here"

# Пароль резервной точки доступа (появляется, если плата не смогла подключиться к Wi-Fi)
ap_password: "generate_your_own_password_here"
